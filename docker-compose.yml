name: preflight

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: preflight
      POSTGRES_PASSWORD: preflight
      POSTGRES_DB: preflight
    ports: ["5432:5432"]
    volumes:
      - pgdata17:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preflight"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redisdata:/data]

  # Raw NOTAM/weather payloads and, later, ATC audio.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: preflight
      MINIO_ROOT_PASSWORD: preflight
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Hourly weather + NOTAM ingest for the watchlist; archives every fetch to ./data/raw.
  scheduler:
    build: .
    command: schedule
    environment:
      DATABASE_URL: postgresql://preflight:preflight@postgres:5432/preflight
      PREFLIGHT_WATCHLIST: ${PREFLIGHT_WATCHLIST:-}
      PREFLIGHT_NASA_DIP_BASE_URL: ${PREFLIGHT_NASA_DIP_BASE_URL:-}
      PREFLIGHT_NASA_DIP_TOKEN: ${PREFLIGHT_NASA_DIP_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # Tracing and eval datasets. Brought up in Sprint 5, declared now so the
  # local stack matches what CI and prod will run. Langfuse runs its own
  # Prisma migrations, so it gets its own database rather than sharing ours.
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [langfusedata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-only-not-a-secret
      SALT: dev-only-not-a-secret
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]

volumes:
  pgdata17:
  redisdata:
  miniodata:
  langfusedata:
