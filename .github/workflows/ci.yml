name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: preflight
          POSTGRES_PASSWORD: preflight
          POSTGRES_DB: preflight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://preflight:preflight@localhost:5432/preflight
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Type check
        run: .venv/bin/mypy

      - name: Apply schema
        run: for f in db/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done

      - name: Test
        run: .venv/bin/python -m pytest

  # Sprint 5 replaces this placeholder with the real gate: the 60-case smoke
  # subset of the time-travel golden set, failing the build when hazard recall
  # drops more than 2 points or p50 cost rises more than 15%.
  eval-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Eval regression gate
        run: echo "Not yet implemented — lands in Sprint 5."
